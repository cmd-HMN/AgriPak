[project]
name = "agripak"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cmd-hmn", email = "hafizmuhammadnoor01@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
agripak = "agripak:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "plotty>=1.5.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]
